<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Mesa 10 Studio News</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Libre+Franklin:wght@500;600&display=swap">
<style>
:root{--bg:#fff;--ink:#121212;--ink-3:#6b6b6b;--rule:#ddd;--red:#b3261e}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#121212;--ink:#efefef;--ink-3:#9a9a9a;--rule:#303030;--red:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
  font-family:"Libre Franklin",Arial,sans-serif;padding:24px 16px}
form{width:100%;max-width:360px;display:grid;gap:14px;text-align:center}
h1{margin:0;font-family:"UnifrakturMaguntia",serif;font-weight:400;font-size:clamp(30px,9vw,44px);line-height:1.1;
  padding-bottom:12px;border-bottom:3px double var(--ink)}
p{margin:0;font-size:14px;color:var(--ink-3)}
input[type=password]{width:100%;padding:13px 12px;font-size:16px;border:1px solid var(--ink);border-radius:3px;background:var(--bg);color:var(--ink)}
label{display:flex;gap:8px;align-items:center;justify-content:center;font-size:14px}
button{padding:13px;border:0;border-radius:3px;background:var(--ink);color:var(--bg);font:600 13px "Libre Franklin",Arial,sans-serif;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.err{color:var(--red);min-height:1.2em}
</style></head>
<body>
<form id="f">
  <h1>Mesa 10 Studio News</h1>
  <p>Martes 6 de octubre de 2026</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="Contraseña" aria-label="Contraseña" required>
  <label><input type="checkbox" id="rec" checked> Recordar en este dispositivo</label>
  <button type="submit">Abrir</button>
  <p class="err" id="err" role="status"></p>
</form>
